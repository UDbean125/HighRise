name: CI

# Build the HighRise app and run its test suite on every push and pull request.
# Runs on a macOS runner because the app needs Xcode / the Apple SDKs.

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test
    runs-on: macos-latest

    steps:
      - name: Check out
        uses: actions/checkout@v5

      # Pre-staged for the Icon Composer .icon (which needs Xcode 26+ to compile).
      # Guarded: selects the newest Xcode >= 26 if the runner has one, otherwise
      # keeps the default toolchain — so this never fails CI before the .icon is
      # added. Matches 26 through 29 (devs are already on macOS 27 / Xcode 27).
      - name: Select Xcode 26+ if available
        run: |
          XC=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$XC" ]; then
            echo "Selecting $XC"
            sudo xcode-select -s "$XC/Contents/Developer"
          else
            echo "Xcode 26+ not on this runner; using default. (Needed once HighRise.icon is added.)"
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run tests
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme HighRise \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild.log | tail -80

      # The iOS companion (HighRiseMobile) has no AppleScript to drive Mail/
      # Outlook, so it can't reuse the macOS send path — it reuses the shared
      # Foundation-only import/merge core and hands off to
      # MFMailComposeViewController instead.
      #
      # Finding a simulator: `xcodebuild -showdestinations` was tried first,
      # but right after a fresh `xcodegen generate` it can report only the
      # generic placeholder destination ("Any iOS Simulator Device") with no
      # real device UUIDs yet, which broke both a `simctl create` fallback
      # (the runtime name "iOS-latest" isn't valid — simctl rejected it) and
      # a second -showdestinations retry (which then picked the placeholder
      # itself). Querying `simctl list devices` directly sidesteps all of
      # that — the runner images ship with real iOS Simulator devices
      # pre-installed, so this just needs one of their UDIDs (preferring an
      # iPhone, but any available iOS device works).
      - name: Test iOS app
        run: |
          set -o pipefail
          DEST=$(xcrun simctl list devices available -j | jq -r '
            .devices
            | to_entries
            | map(select(.key | test("iOS"; "i")))
            | map(.value[])
            | map(select(.isAvailable))
            | (map(select(.name | test("iPhone"))) + .)
            | .[0].udid // empty
          ')
          if [ -z "$DEST" ]; then
            echo "::error::No available iOS Simulator device found on this runner."
            exit 1
          fi
          echo "Using simulator id: $DEST"
          xcodebuild test \
            -scheme HighRiseMobile \
            -destination "platform=iOS Simulator,id=$DEST" \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild-ios.log | tail -80

      # HighRise-MAS is the sandboxed Mac App Store variant (see
      # MAS_VARIANT_PLAN.md) — same sources as HighRise, but with
      # app-sandbox entitlement on and Outlook gated out via MAS_BUILD.
      # Ad-hoc signing (not CODE_SIGNING_ALLOWED=NO like the other jobs)
      # because entitlements are only embedded via an actual code signature —
      # this is the regression check that nobody silently flips the sandbox
      # entitlement off or breaks the entitlements file wiring.
      - name: Build HighRise-MAS and verify the sandbox entitlement
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme HighRise-MAS \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath /tmp/mas-build \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            | tee xcodebuild-mas.log | tail -80

          APP="/tmp/mas-build/Build/Products/Release/HighRise-MAS.app"
          codesign -d --entitlements :- "$APP" > entitlements.plist
          SANDBOX=$(/usr/libexec/PlistBuddy -c "Print :com.apple.security.app-sandbox" entitlements.plist 2>/dev/null || echo "MISSING")
          if [ "$SANDBOX" != "true" ]; then
            echo "::error::HighRise-MAS's com.apple.security.app-sandbox entitlement is '$SANDBOX', expected 'true'"
            cat entitlements.plist
            exit 1
          fi
          echo "Confirmed: com.apple.security.app-sandbox = true"

  # The Windows companion (Windows/HighRise-Merge.ps1) targets Windows
  # PowerShell 5.1, which only exists on Windows — so its dry run is exercised
  # here under both 5.1 and PowerShell 7. -DryRun never touches Outlook.
  windows-dry-run:
    name: Windows merge tool dry run
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Starter-template catalog matches the Swift source
        shell: bash
        run: python3 Tools/export-templates.py --check

      - name: Template browser under Windows PowerShell 5.1
        shell: powershell
        run: |
          # Unfiltered listing
          $all = & .\Windows\HighRise-Templates.ps1 *>&1 | Out-String
          Write-Host $all
          if ($all -notlike '*templates.*') { throw 'Template listing produced no summary' }

          # Industry + audience narrowing, then save one and merge with it.
          $filtered = & .\Windows\HighRise-Templates.ps1 -Industry Construction -Audience Candidates *>&1 | Out-String
          Write-Host $filtered
          if ($filtered -notlike '*construction-crew-hiring*') { throw 'Industry/audience filter lost its tailored template' }

          $search = & .\Windows\HighRise-Templates.ps1 -Search 'invoice' *>&1 | Out-String
          if ($search -notlike '*invoice-reminder*') { throw 'Search did not find the invoice reminder' }

          $tpl = Join-Path $env:RUNNER_TEMP 'picked-template.txt'
          & .\Windows\HighRise-Templates.ps1 -Id construction-crew-hiring -Save $tpl *>&1 | Out-String | Write-Host
          if (-not (Test-Path -LiteralPath $tpl)) { throw 'Saving a starter template produced no file' }

          # The saved template must actually merge - that is the whole point.
          $merged = & .\Windows\HighRise-Merge.ps1 -Csv .\Examples\sample-recipients.csv -Template $tpl -DryRun *>&1 | Out-String
          Write-Host $merged
          if ($merged -like '*{{*') { throw 'A raw placeholder survived the merge of a starter template' }

      - name: Do-not-contact list is honored under Windows PowerShell 5.1
        shell: powershell
        run: |
          $list = Join-Path $env:RUNNER_TEMP 'dnc.json'
          $csv = '.\Examples\sample-recipients.csv'
          $tpl = '.\Windows\Examples\sample-template.txt'

          # Block one person and one whole domain.
          & .\Windows\HighRise-DoNotContact.ps1 -Path $list -Add 'sam@acme.com' -Note 'Opted out' *>&1 | Write-Host
          & .\Windows\HighRise-DoNotContact.ps1 -Path $list -Add 'initech.io' *>&1 | Write-Host

          $listing = & .\Windows\HighRise-DoNotContact.ps1 -Path $list *>&1 | Out-String
          Write-Host $listing
          if ($listing -notlike '*2 blocked*') { throw 'Listing did not report both entries' }
          if ($listing -notlike '*everyone @initech.io*') { throw 'Domain entry not shown as a domain' }

          # -Test agrees with the list, including via the domain rule.
          $t1 = & .\Windows\HighRise-DoNotContact.ps1 -Path $list -Test 'sam@acme.com' *>&1 | Out-String
          if ($t1 -notlike '*BLOCKED*') { throw '-Test missed a blocked address' }
          $t2 = & .\Windows\HighRise-DoNotContact.ps1 -Path $list -Test 'bob@initech.io' *>&1 | Out-String
          if ($t2 -notlike '*BLOCKED*') { throw '-Test missed an address blocked by its domain' }
          $t3 = & .\Windows\HighRise-DoNotContact.ps1 -Path $list -Test 'dana@toys.example' *>&1 | Out-String
          if ($t3 -notlike '*Allowed*') { throw '-Test wrongly blocked an unlisted address' }

          # The merge must hold both back - 3 sendable normally, 1 with these.
          $merged = & .\Windows\HighRise-Merge.ps1 -Csv $csv -Template $tpl -DoNotContact $list -DryRun *>&1 | Out-String
          Write-Host $merged
          if ($merged -notlike '*do-not-contact list*') { throw 'Merge did not report loading the list' }
          if ($merged -notlike '*1 message(s) would be drafted, 4 blocked*') { throw "Suppressed rows were not held back: $merged" }
          if ($merged -notlike '*sam@acme.com is skipped*') { throw 'Address suppression reason missing' }
          if ($merged -notlike '*bob@initech.io is skipped*') { throw 'Domain suppression reason missing' }

          # Unblocking restores them.
          & .\Windows\HighRise-DoNotContact.ps1 -Path $list -Remove 'sam@acme.com' *>&1 | Write-Host
          $after = & .\Windows\HighRise-Merge.ps1 -Csv $csv -Template $tpl -DoNotContact $list -DryRun *>&1 | Out-String
          if ($after -notlike '*2 message(s) would be drafted, 3 blocked*') { throw "Unblocking did not restore the recipient: $after" }

          # The escape hatch works and announces itself.
          $ignored = & .\Windows\HighRise-Merge.ps1 -Csv $csv -Template $tpl -DoNotContact $list -IgnoreDoNotContact -DryRun *>&1 | Out-String
          if ($ignored -notlike '*WARNING: -IgnoreDoNotContact*') { throw 'Ignoring the list was not announced' }
          if ($ignored -notlike '*3 message(s) would be drafted, 2 blocked*') { throw 'IgnoreDoNotContact did not restore every recipient' }

          # A corrupt list must stop the run, never quietly email everyone.
          $bad = Join-Path $env:RUNNER_TEMP 'corrupt.json'
          Set-Content -LiteralPath $bad -Value 'not json{{{' -Encoding UTF8
          $failed = $false
          try { & .\Windows\HighRise-Merge.ps1 -Csv $csv -Template $tpl -DoNotContact $bad -DryRun *>&1 | Out-String | Write-Host }
          catch { $failed = $true }
          if (-not $failed) { throw 'A corrupt do-not-contact list did not stop the run' }

      - name: Interrupted run is not re-sent under Windows PowerShell 5.1
        shell: powershell
        run: |
          $csv = '.\Examples\sample-recipients.csv'
          $tpl = '.\Windows\Examples\sample-template.txt'
          $csvFull = (Convert-Path -LiteralPath $csv)
          $tplFull = (Convert-Path -LiteralPath $tpl)
          $log = Join-Path $env:RUNNER_TEMP 'run-journal.json'

          function New-InterruptedJournal {
            param([string]$Path, [string]$ForCsv, [string]$ForTemplate)
            $fixture = [pscustomobject]@{
              startedAt = '2026-01-01T09:00:00.0000000-05:00'
              mode      = 'send'
              csv       = $ForCsv
              template  = $ForTemplate
              total     = 5
              finished  = $false
              records   = @(
                [pscustomobject]@{ email = 'sam@acme.com';   name = 'Sam'; status = 'sent'; reason = ''; at = '2026-01-01T09:00:01-05:00' },
                [pscustomobject]@{ email = 'BOB@Initech.io'; name = 'Bob'; status = 'sent'; reason = ''; at = '2026-01-01T09:00:02-05:00' }
              )
            }
            Set-Content -LiteralPath $Path -Value ($fixture | ConvertTo-Json -Depth 5) -Encoding UTF8
          }

          # A completed run leaves a journal marked finished, with every row.
          Remove-Item -LiteralPath $log -ErrorAction SilentlyContinue
          $first = & .\Windows\HighRise-Merge.ps1 -Csv $csv -Template $tpl -RunLog $log -DryRun *>&1 | Out-String
          Write-Host $first
          if (-not (Test-Path -LiteralPath $log)) { throw 'The run wrote no journal' }
          $saved = Get-Content -LiteralPath $log -Raw | ConvertFrom-Json
          if (-not $saved.finished) { throw 'A run that reached the end left its journal marked unfinished' }
          if (@($saved.records).Count -ne 5) { throw "Journal recorded $(@($saved.records).Count) of 5 rows" }

          # A finished journal must never cause skips - that would break re-sending.
          $again = & .\Windows\HighRise-Merge.ps1 -Csv $csv -Template $tpl -RunLog $log -DryRun *>&1 | Out-String
          if ($again.Contains('[SKIPPED]')) { throw 'A finished journal wrongly skipped recipients' }

          # An unfinished journal for this same list means the last attempt died
          # partway through: whoever it reached must not be emailed a second time.
          New-InterruptedJournal -Path $log -ForCsv $csvFull -ForTemplate $tplFull
          $resumed = & .\Windows\HighRise-Merge.ps1 -Csv $csv -Template $tpl -RunLog $log -DryRun *>&1 | Out-String
          Write-Host $resumed
          if ($resumed -notlike '*did not finish*') { throw 'The interrupted previous run was not reported' }
          if (-not $resumed.Contains('[SKIPPED] Sam <sam@acme.com>')) { throw 'An already-sent recipient was not skipped' }
          if (-not $resumed.Contains('[SKIPPED] Bob')) { throw 'A recipient recorded in mixed case was not skipped - matching must be case insensitive' }
          if ($resumed -notlike '*1 message(s) would be drafted*') { throw "Wrong number of recipients survived the skip: $resumed" }

          # The carried-forward journal stays the single answer to "who already got it".
          $merged = Get-Content -LiteralPath $log -Raw | ConvertFrom-Json
          $sent = @($merged.records | Where-Object { $_.status -eq 'sent' })
          if ($sent.Count -ne 2) { throw 'The previous run''s deliveries were dropped from the journal' }

          # -ShowLastRun reports it, and needs no -Csv/-Template.
          $shown = & .\Windows\HighRise-Merge.ps1 -ShowLastRun -RunLog $log *>&1 | Out-String
          Write-Host $shown
          if ($shown -notlike '*sam@acme.com*') { throw '-ShowLastRun did not list who was reached' }

          # The escape hatch works and announces itself.
          New-InterruptedJournal -Path $log -ForCsv $csvFull -ForTemplate $tplFull
          $ignored = & .\Windows\HighRise-Merge.ps1 -Csv $csv -Template $tpl -RunLog $log -IgnorePreviousRun -DryRun *>&1 | Out-String
          if ($ignored -notlike '*WARNING: -IgnorePreviousRun*') { throw 'Ignoring the previous run was not announced' }
          if ($ignored.Contains('[SKIPPED]')) { throw '-IgnorePreviousRun still skipped recipients' }

          # An unfinished journal from a different list must not silently drop
          # recipients out of this one.
          New-InterruptedJournal -Path $log -ForCsv 'C:\somewhere\other-list.csv' -ForTemplate $tplFull
          $onDisk = Get-Content -LiteralPath $log -Raw
          $other = & .\Windows\HighRise-Merge.ps1 -Csv $csv -Template $tpl -RunLog $log -DryRun *>&1 | Out-String -Width 500
          if ($other -notlike '*different list or template*') { throw "A foreign unfinished journal was not reported.`nJournal on disk was:`n$onDisk`nRun said:`n$other" }
          if ($other.Contains('[SKIPPED]')) { throw 'A foreign unfinished journal wrongly skipped recipients' }

          # A corrupt journal must stop the run, never quietly re-email everyone.
          Set-Content -LiteralPath $log -Value 'not json{{{' -Encoding UTF8
          $failed = $false
          try { & .\Windows\HighRise-Merge.ps1 -Csv $csv -Template $tpl -RunLog $log -DryRun *>&1 | Out-String | Write-Host }
          catch { $failed = $true }
          if (-not $failed) { throw 'A corrupt run journal did not stop the run' }

          # -NoRunLog writes nothing at all.
          $none = Join-Path $env:RUNNER_TEMP 'should-not-exist.json'
          Remove-Item -LiteralPath $none -ErrorAction SilentlyContinue
          & .\Windows\HighRise-Merge.ps1 -Csv $csv -Template $tpl -RunLog $none -NoRunLog -DryRun *>&1 | Out-Null
          if (Test-Path -LiteralPath $none) { throw '-NoRunLog still wrote a journal' }

      # A malformed token cannot be stripped, because the merge regex never
      # matches it in the first place - it reaches the recipient verbatim. macOS
      # and iOS warn about unbalanced braces; this pins the same warning here.
      # Out-String needs an explicit -Width: the warning is longer than the
      # default 80-column wrap, and a wrapped line fails -like silently.
      - name: Malformed merge-field braces are reported under Windows PowerShell 5.1
        shell: powershell
        run: |
          $csv = '.\Examples\sample-recipients.csv'
          $marker = 'Unclosed merge field'

          # First, the negative case: a well-formed template must stay silent.
          # A check that cries wolf on every run is one people learn to ignore.
          $clean = & .\Windows\HighRise-Merge.ps1 -Csv $csv -Template '.\Windows\Examples\sample-template.txt' -DryRun *>&1 | Out-String -Width 500
          if ($clean -like "*$marker*") { throw "A well-formed template was wrongly flagged: $clean" }

          # An unclosed brace in the subject.
          $badSubject = Join-Path $env:RUNNER_TEMP 'bad-subject.txt'
          Set-Content -LiteralPath $badSubject -Encoding UTF8 -Value @(
            'Subject: Quick question about {{Company',
            '',
            'Hi {{First Name}}, thanks for your time.'
          )
          $s = & .\Windows\HighRise-Merge.ps1 -Csv $csv -Template $badSubject -DryRun *>&1 | Out-String -Width 500
          Write-Host $s
          if ($s -notlike "*$marker*") { throw "An unclosed brace in the subject was not reported: $s" }
          if ($s -notlike '*WARNING: Subject:*') { throw "The warning did not name the subject: $s" }
          # This is the whole reason the warning has to exist: the broken token
          # is not stripped like an unresolved one, it survives into the message.
          if ($s -notlike '*{{Company*') { throw "The malformed token did not survive - this test no longer proves anything: $s" }
          # A balanced body alongside it must not also be flagged.
          if ($s -like '*WARNING: Body:*') { throw "A balanced body was wrongly flagged: $s"  }

          # An unclosed brace in the body.
          $badBody = Join-Path $env:RUNNER_TEMP 'bad-body.txt'
          Set-Content -LiteralPath $badBody -Encoding UTF8 -Value @(
            'Subject: Quick question',
            '',
            'Hi {{First Name, thanks for your time.'
          )
          $b = & .\Windows\HighRise-Merge.ps1 -Csv $csv -Template $badBody -DryRun *>&1 | Out-String -Width 500
          Write-Host $b
          if ($b -notlike '*WARNING: Body:*') { throw "An unclosed brace in the body was not reported: $b" }
          if ($b -like '*WARNING: Subject:*') { throw "A balanced subject was wrongly flagged: $b" }

          # A stray closer with no opener is just as broken as a stray opener.
          $strayClose = Join-Path $env:RUNNER_TEMP 'stray-close.txt'
          Set-Content -LiteralPath $strayClose -Encoding UTF8 -Value @(
            'Subject: Quick question',
            '',
            'Hi there}} - thanks for your time.'
          )
          $c = & .\Windows\HighRise-Merge.ps1 -Csv $csv -Template $strayClose -DryRun *>&1 | Out-String -Width 500
          if ($c -notlike "*$marker*") { throw "A stray closing brace was not reported: $c" }

      - name: Dry run under Windows PowerShell 5.1
        shell: powershell
        run: |
          $out = & .\Windows\HighRise-Merge.ps1 -Csv .\Examples\sample-recipients.csv -Template .\Windows\Examples\sample-template.txt -DryRun *>&1 | Out-String
          Write-Host $out
          if ($out -notlike '*3 message(s) would be drafted, 2 blocked*') { throw 'Unexpected dry-run summary' }
          if ($out -notlike '*Quick question about Acme, Inc.*') { throw 'Merged subject missing from output' }
          if ($out -notlike '*Invalid email address: not-an-email*') { throw 'Invalid-email row was not blocked' }
          if ($out -notlike '*Missing data for: Company*') { throw 'Missing-field row was not blocked' }

      - name: Dry run under PowerShell 7
        shell: pwsh
        run: |
          $out = & .\Windows\HighRise-Merge.ps1 -Csv .\Examples\sample-recipients.csv -Template .\Windows\Examples\sample-template.txt -DryRun *>&1 | Out-String
          Write-Host $out
          if ($out -notlike '*3 message(s) would be drafted, 2 blocked*') { throw 'Unexpected dry-run summary' }
          if ($out -notlike '*Quick question about Acme, Inc.*') { throw 'Merged subject missing from output' }
